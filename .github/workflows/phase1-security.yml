name: Consulting database gates

on:
  pull_request:
    paths:
      - ".github/workflows/phase1-security.yml"
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "scripts/consulting-os/**"
      - "supabase/**"
      - "docs/consulting-os/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consulting-database-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  database-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out private repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned tooling
        run: npm ci

      - name: Verify canonical and static database contracts
        shell: pwsh
        run: |
          ./scripts/consulting-os/verify_phase0_docs.ps1
          ./scripts/consulting-os/verify_phase1_security.ps1

          ./scripts/consulting-os/verify_phase2_meridian.ps1
          ./scripts/consulting-os/verify_phase3_consulting_core.ps1
          ./scripts/consulting-os/verify_phase4_portals.ps1

      - name: Verify portal application
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify role-safe portals in browser
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase4-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Start isolated Supabase database
        run: npm run db:start

      - name: Lint Consulting schemas
        run: npm run db:lint

      - name: Run adversarial pgTAP suite
        run: npm run test:db

      - name: Remove disposable database
        if: always()
        run: npm run db:stop
